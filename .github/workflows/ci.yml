name: CI — Build & Test (Windows x64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache PDFium & QPDF native binaries
        id: cache-native
        uses: actions/cache@v4
        with:
          path: |
            third_party/pdfium
            third_party/qpdf
          key: win-x64-pdfium-8165-qpdf-12.4.2

      - name: Fetch PDFium & QPDF binaries
        if: steps.cache-native.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\scripts\fetch-pdfium.ps1
          .\scripts\fetch-qpdf.ps1

      - name: Configure & Build C++20 Engine (MSVC x64 Release)
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release

      - name: Build .NET 10 Solution (Release)
        shell: pwsh
        run: dotnet build PDFVisor.slnx -c Release

      - name: Run End-to-End Tests (xUnit)
        shell: pwsh
        run: dotnet test PDFVisor.slnx -c Release --no-build --verbosity normal
